name: Update gold price

# bajus.org can't be read from the browser (no CORS), so this job reads it
# and commits public/gold.json when the price changes, then redeploys.
on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/fetch-gold.ts
      - name: Commit and redeploy if the price changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/gold.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update 21K gold price" -- public/gold.json
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
